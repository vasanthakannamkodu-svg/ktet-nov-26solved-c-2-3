ia) ഉള്ള ഒരു വിദ്യാർത്ഥി പ്രധാനമായും ഏത് മേഖലയിലാണ് ബുദ്ധിമുട്ടുകൾ നേരിടുക?","opts":["Physical Education","Reading stories","Mathematical calculations and number sense","Drawing and painting"],"optsMl":["കായിക വിദ്യാഭ്യാസം","കഥകൾ വായിക്കൽ","ഗണിതശാസ്ത്രപരമായ കണക്കുകൂട്ടലുകളും സംഖ്യാബോധവും","ചിത്രരചനയും പെയിന്റിംിംഗും"],"a":2,"category":"Category II","topic":"Dyscalculia"},{"q":"Which cognitive process is lacking in children who believe what others say without verifying if it is true?","ml":"മറ്റുള്ളവർ പറയുന്ന കാര്യങ്ങൾ ശരിയാണോ എന്ന് പരിശോധിക്കാതെ വിശ്വസിക്കുന്ന കുട്ടികളിൽ കുറവുള്ള വൈജ്ഞാനിക പ്രക്രിയ ഏതാണ്?","opts":["Critical Thinking","Imagination","Memory","Sensation"],"optsMl":["വിമർശനാത്മക ചിന്ത","ഭാവന","ഓർമ്മശക്തി","സംവേദനം"],"a":0,"category":"Category II","topic":"Critical Thinking"},{"q":"While fixing a toy the child talks himself/herself that this should be placed here. According to Vygotsky, this self-talk takes place due to:","ml":"ഒരു കളിപ്പാട്ടം നന്നാക്കുന്നതിനിടയിൽ ഒരു കുട്ടി \"ഇത് ഇവിടെ വെക്കണം\" എന്ന് സ്വയം സംസാരിക്കുന്നു. വൈഗോട്സ്കിയുടെ അഭിപ്രായത്തിൽ ഇത്തരം സ്വയം സംസാരം എന്തിനുവേണ്ടിയാണ് നടക്കുന്നത്?","opts":["Attract others' attention","Solve speech defects","Regulate their own thinking","Spend time for entertainment"],"optsMl":["മറ്റുള്ളവരുടെ ശ്രദ്ധ ആകർഷിക്കാൻ","സംസാര വൈകല്യങ്ങൾ പരിഹരിക്കാൻ","സ്വന്തം ചിന്തകളെ നിയന്ത്രിക്കാൻ","വിനോദത്തിനായി സമയം ചെലവഴിക്കാൻ"],"a":2,"category":"Category II","topic":"Vygotsky's Self-talk"},{"q":"Projective techniques are used to find out:","ml":"പ്രൊജക്റ്റീവ് ടെക്നിക്കുകൾ (Projective Techniques) എന്ത് കണ്ടെത്തുന്നതിനാണ് ഉപയോഗിക്കുന്നത്?","opts":["Intelligence","Personality","Physical fitness","Hearing"],"optsMl":["ബുദ്ധിശക്തി","വ്യക്തിത്വം","ശാരീരിക ക്ഷമത","കേൾവിശക്തി"],"a":1,"category":"Category II","topic":"Projective Techniques"},{"q":"What is the most important aspect a teacher should ensure during group discussions?","ml":"ഗ്രൂപ്പ് ചർച്ചകളിൽ അധ്യാപകൻ ഉറപ്പാക്കേണ്ട ഏറ്റവും പ്രധാനപ്പെട്ട കാര്യം ഏതാണ്?","opts":["Directing to end the discussions quickly","Ensuring the active participation of all members","Asking students to maintain absolute silence","Staying completely away from the discussions"],"optsMl":["ചർച്ചകൾ വേഗത്തിൽ അവസാനിപ്പിക്കാൻ നിർദ്ദേശിക്കുക","എല്ലാ അംഗങ്ങളുടെയും സജീവ പങ്കാളിത്തം ഉറപ്പാക്കുക","വിദ്യാർത്ഥികളോട് പൂർണ്ണ നിശ്ശബ്ദത പാലിക്കാൻ","ചർച്ചകളിൽ നിന്ന് പൂർണ്ണമായും വിട്ടുനിൽക്കുക"],"a":1,"category":"Category II","topic":"Group Discussion"}];let order=[],pos=0,score=0,answered=0,locked=false,session=[];
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let previousOrder=[];
function start(){const fresh=BANK.map((_,i)=>i);shuffle(fresh);if(previousOrder.length===fresh.length&&fresh.every((v,i)=>v===previousOrder[i])){const j=Math.floor(Math.random()*(fresh.length-1))+1;[fresh[0],fresh[j]]=[fresh[j],fresh[0]];}order=fresh;previousOrder=[...order];pos=0;score=0;answered=0;locked=false;session=[];$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function render(){locked=false;const d=BANK[order[pos]];const perm=shuffle([0,1,2,3]);session[pos]={idx:order[pos],perm,chosen:null};$('qnum').textContent=`${d.category.toUpperCase()} · QUESTION ${pos+1} / ${BANK.length}`;$('topic').textContent=d.topic||'';$('topic').style.display=d.topic?'block':'none';$('question').textContent=d.q;$('ml').textContent=d.ml;$('progressText').textContent=`Question ${pos+1} of ${BANK.length}`;$('scoreText').textContent=`Score: ${score}`;$('answeredText').textContent=`Answered: ${answered}`;$('progressBar').style.width=`${answered/BANK.length*100}%`;$('feedback').className='feedback hidden';$('feedback').innerHTML='';$('next').disabled=true;$('next').textContent=pos===BANK.length-1?'Finish / പൂർത്തിയാക്കുക':'Next Question / അടുത്ത ചോദ്യം';$('options').innerHTML='';perm.forEach((originalIndex,displayIndex)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="letter">${letters[displayIndex]}</span><span class="opt-copy"><span class="opt-en">${escapeHtml(d.opts[originalIndex])}</span><small class="opt-ml">${escapeHtml(d.optsMl[originalIndex])}</small></span>`;b.addEventListener('click',()=>choose(originalIndex,displayIndex));$('options').appendChild(b)})}
function playFeedbackSound(isCorrect){try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;const ctx=new Ctx();const now=ctx.currentTime;function tone(freq,start,duration,type,volume){const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now+start);gain.gain.setValueAtTime(0.0001,now+start);gain.gain.exponentialRampToValueAtTime(volume,now+start+0.02);gain.gain.exponentialRampToValueAtTime(0.0001,now+start+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(now+start);osc.stop(now+start+duration+0.03)}if(isCorrect){tone(660,0,0.16,'sine',0.16);tone(880,0.13,0.22,'sine',0.16);tone(1100,0.28,0.24,'sine',0.14)}else{tone(220,0,0.20,'square',0.09);tone(165,0.18,0.25,'square',0.08)}setTimeout(()=>ctx.close().catch(()=>{}),900)}catch(e){}}
function choose(originalIndex,displayIndex){if(locked)return;locked=true;const d=BANK[order[pos]],s=session[pos];s.chosen=originalIndex;answered++;const correct=originalIndex===d.a;if(correct){try{const music=$('correctAnswerMusic');music.pause();music.currentTime=0;music.volume=1;const playback=music.play();if(playback&&playback.catch)playback.catch(()=>{});}catch(e){}}else{playFeedbackSound(false)}if(correct)score++;[...$('options').children].forEach((b,i)=>{const oi=s.perm[i];b.disabled=true;if(oi===d.a)b.classList.add('correct');else if(oi===originalIndex)b.classList.add('wrong')});const f=$('feedback');f.className='feedback '+(correct?'good':'bad');f.innerHTML=`<h3>${correct?'Correct! / ശരിയുത്തരം':'Incorrect / തെറ്റായ ഉത്തരം'}</h3><p><strong>Correct answer / ശരിയുത്തരം: ${letters[d.a]}. ${escapeHtml(d.opts[d.a])}</strong><br><span>${escapeHtml(d.optsMl[d.a])}</span></p>`;$('scoreText').textContent=`Score: ${score}`;$('answeredText').textContent=`Answered: ${answered}`;$('progressBar').style.width=`${answered/BANK.length*100}%`;$('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){if(!locked)return;if(pos<BANK.length-1){pos++;render();window.scrollTo({top:0,behavior:'smooth'})}else{showResult()}}
function showResult(){$('quiz').classList.add('hidden');const r=$('result');r.classList.remove('hidden');r.innerHTML=`<h2>Test Completed / പരീക്ഷ പൂർത്തിയായി</h2><p><strong>Score: ${score} / ${BANK.length}</strong></p><p>Correct: ${score} · Incorrect: ${answered-score}</p><p>Review the explanations. Questions remain in sequence; options are shuffled on each attempt.</p><button class="btn primary" id="restartResult">Restart Test / വീണ്ടും ആരംഭിക്കുക</button>`;$('restartResult').addEventListener('click',start);r.scrollIntoView({behavior:'smooth'})}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('restart').addEventListener('click',start);$('next').addEventListener('click',next);start();
</script></body></html>
